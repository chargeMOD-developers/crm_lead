name: Deploy CRM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync code to server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/${{ secrets.DEPLOY_USER }}/frappe/frappe-bench/apps/crm/

      - name: Run deploy commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -e

            export PATH="$HOME/.local/bin:$PATH"

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm use 24
            fi

            BENCH="$HOME/.local/bin/bench"
            BENCH_DIR="/home/${{ secrets.DEPLOY_USER }}/frappe/frappe-bench"
            SITE="crm.chargemod.com"

            cd "$BENCH_DIR"

            echo "Checking bench..."
            "$BENCH" --version

            echo "Installing/updating requirements..."
            "$BENCH" setup requirements crm || true

            echo "Running migrations..."
            "$BENCH" --site "$SITE" migrate

            echo "Building CRM assets..."
            "$BENCH" build --app crm

            echo "Clearing cache..."
            "$BENCH" --site "$SITE" clear-cache
            "$BENCH" --site "$SITE" clear-website-cache

            echo "Restarting services..."
            sudo supervisorctl restart all
            sudo systemctl reload nginx

            echo "Deployed successfully"
